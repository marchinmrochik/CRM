name: Project checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:8.2.11-bookworm
        ports: ['46379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=12
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: jobhunt
          POSTGRES_USER: jobhunt_local
          POSTGRES_PASSWORD: ci-only-synthetic-password-not-a-secret
        ports: ['45432:5432']
        options: --health-cmd="pg_isready -U jobhunt_local -d jobhunt" --health-interval=5s --health-timeout=3s --health-retries=12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: Configure synthetic test environment
        run: |
          cp .env.example .env
          sed -i 's/replace_with_a_random_local_password/ci-only-synthetic-password-not-a-secret/; s/replace_with_a_random_session_secret/ci-only-session-secret-with-sufficient-length/; s/replace_with_a_random_owner_password/ci-only-owner-password/' .env
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm lint && pnpm typecheck && pnpm test:coverage && pnpm build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: unit-integration-coverage
          path: coverage/
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser journey
        run: |
          pnpm --filter @jobhunt/api start > /tmp/job-api.log 2>&1 &
          pnpm --filter @jobhunt/api worker > /tmp/job-worker.log 2>&1 &
          pnpm --filter @jobhunt/web start > /tmp/job-web.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:43170 >/dev/null && curl -fsS http://127.0.0.1:43171/api/v1/health/ready >/dev/null; then break; fi; sleep 1; done
          pnpm exec playwright test
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-failures
          path: test-results/
